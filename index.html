<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F1F0F5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0E0E13" media="(prefers-color-scheme: dark)" />
  <title>BringStuff — Shared bring lists</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app"></div>

  <!-- Home view -->
  <template id="tpl-home">
    <header class="topbar">
      <div class="topbar-inner">
        <h1 class="large-title" data-t="brand">BringStuff</h1>
        <div class="spacer"></div>
        <div class="lang-toggle" id="lang-toggle">
          <button data-lang="en">EN</button>
          <button data-lang="ru">RU</button>
        </div>
      </div>
    </header>
    <main class="scroll">
      <section class="hero">
        <p class="hero-sub" data-t="home_sub"></p>
      </section>
      <section class="section">
        <div class="section-header" data-t="new_list"></div>
        <div class="card spaced">
          <input class="row-input solo" id="new-name" type="text" data-t-placeholder="new_name_ph" autocomplete="off" />
          <button class="row-button primary" id="btn-create" data-t="create_list"></button>
        </div>
      </section>
      <section class="section" id="recent-section" hidden>
        <div class="section-header" data-t="recent"></div>
        <div class="card list-grouped" id="recent-list"></div>
      </section>
      <footer class="footnote" data-t="home_footer"></footer>
    </main>
  </template>

  <!-- List view -->
  <template id="tpl-list">
    <header class="topbar">
      <div class="topbar-inner">
        <button class="nav-btn bare" id="btn-back" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1 class="large-title editable" id="list-title" contenteditable="true" spellcheck="false"></h1>
        <div class="lang-toggle" id="lang-toggle">
          <button data-lang="en">EN</button>
          <button data-lang="ru">RU</button>
        </div>
        <button class="nav-btn me-chip" id="me-chip" hidden>
          <span id="me-chip-name"></span>
        </button>
      </div>
      <div class="search-row">
        <svg class="search-row-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="search-input" type="search" data-t-placeholder="search_ph" autocomplete="off" />
        <button class="search-clear-btn" id="btn-search-clear" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>
      <div class="me-row" id="me-row">
        <div class="me-welcome">
          <p class="me-welcome-title" data-t="welcome_title"></p>
          <label for="me-input" class="me-welcome-hint" data-t="welcome_hint"></label>
          <div class="me-welcome-form">
            <input id="me-input" class="me-input" type="text" data-t-placeholder="your_name_ph" autocomplete="off" />
            <button class="me-save" id="me-save" data-t="save"></button>
          </div>
        </div>
      </div>
      <div class="chip-row" id="filter-seg">
        <button class="chip sort-chip" id="btn-sort" aria-label="Sort">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13"/><path d="M3 12h9"/><path d="M3 18h5"/><path d="M17 4v16"/><path d="M14 17l3 3 3-3"/></svg>
        </button>
        <button data-filter="all" class="chip active"><span data-t="filter_all"></span><span class="count" id="cnt-all"></span></button>
        <button data-filter="mine" class="chip"><span data-t="filter_mine"></span><span class="count" id="cnt-mine"></span></button>
        <button data-filter="taken" class="chip"><span data-t="filter_taken"></span><span class="count" id="cnt-taken"></span></button>
        <button data-filter="open" class="chip"><span data-t="filter_open"></span><span class="count" id="cnt-open"></span></button>
      </div>
    </header>

    <main class="scroll">
      <div class="add-block">
        <div class="card add-row">
          <span class="add-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </span>
          <textarea class="add-textarea" id="add-input" rows="1" data-t-placeholder="add_item_ph" autocomplete="off" autocapitalize="sentences"></textarea>
          <button class="add-check-btn" id="btn-add" aria-label="Add item">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
        </div>
      </div>
      <div class="card list-grouped" id="items"></div>

      <div class="footnote" id="stat-line"></div>
    </main>

    <div class="selection-bar" id="sel-bar" hidden>
      <div class="sel-count" id="sel-count"></div>
      <button class="pill" id="sel-clear" data-t="sel_clear"></button>
      <button class="pill primary" id="sel-assign"></button>
      <button class="pill overflow" id="sel-overflow" aria-label="More">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
  </template>

  <!-- Paste sheet -->
  <template id="tpl-paste-sheet">
    <div class="sheet-backdrop"></div>
    <div class="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <button class="sheet-btn" data-close data-t="cancel"></button>
        <div class="sheet-title" data-t="paste_sheet_title"></div>
        <button class="sheet-btn primary" data-confirm data-t="add"></button>
      </div>
      <div class="sheet-body">
        <p class="sheet-hint" data-t-html="paste_hint"></p>
        <textarea class="sheet-textarea" id="paste-text" data-t-placeholder="paste_example"></textarea>
        <label class="switch-row">
          <span data-t="replace_existing"></span>
          <input type="checkbox" id="paste-replace" />
        </label>
      </div>
    </div>
  </template>

  <!-- Item detail (iOS push-nav style) -->
  <template id="tpl-item-view">
    <div class="push-panel item-detail-panel" role="dialog" aria-modal="true">
      <header class="topbar push-topbar">
        <div class="topbar-inner">
          <button class="nav-btn tint cancel-btn" data-close data-t="cancel"></button>
          <div class="spacer"></div>
          <button class="save-btn-primary" data-confirm data-t="save"></button>
        </div>
      </header>
      <main class="scroll push-body">
        <div class="item-topline">
          <div class="item-topline-name">
            <label class="field-label" data-t="field_name"></label>
            <input class="row-input solo" id="edit-name" type="text" />
          </div>
          <div class="item-topline-qty">
            <label class="field-label" data-t="field_qty"></label>
            <input class="row-input solo" id="edit-qty" type="number" min="1" inputmode="numeric" data-t-placeholder="field_qty_ph" />
          </div>
        </div>
        <label class="field-label" data-t="field_note"></label>
        <textarea class="row-input solo item-note-area" id="edit-note" data-t-placeholder="field_note_ph"></textarea>
        <label class="field-label" data-t="field_bringing"></label>
        <div class="assignee-editor" id="assignee-editor"></div>
      </main>
      <div class="delete-anchor">
        <button class="row-button destructive" id="btn-delete" data-t="delete_item"></button>
      </div>
    </div>
  </template>

  <!-- Delete-confirm action sheet -->
  <template id="tpl-confirm-delete-sheet">
    <div class="sheet-backdrop"></div>
    <div class="sheet confirm-sheet">
      <div class="sheet-body">
        <p class="confirm-title" data-t="confirm_delete_title"></p>
        <p class="sheet-hint confirm-hint" data-t="confirm_delete_hint"></p>
      </div>
      <div class="confirm-actions">
        <button class="row-button destructive filled" data-confirm data-t="delete_item"></button>
        <button class="row-button" data-close data-t="cancel"></button>
      </div>
    </div>
  </template>

  <!-- Name push panel (iOS-style "You are" editor) -->
  <template id="tpl-name-view">
    <div class="push-panel" role="dialog" aria-modal="true">
      <header class="topbar push-topbar">
        <div class="topbar-inner">
          <button class="nav-btn tint cancel-btn" data-close data-t="cancel"></button>
          <div class="spacer"></div>
          <button class="save-btn-primary" data-confirm data-t="save"></button>
        </div>
        <div class="topbar-title-row">
          <h1 class="large-title" data-t="you_are_title"></h1>
        </div>
      </header>
      <main class="scroll push-body">
        <p class="sheet-hint" data-t="you_are_hint"></p>
        <label class="field-label" data-t="field_your_name"></label>
        <input class="row-input solo" id="name-input" type="text" autocapitalize="words" data-t-placeholder="your_name_ph" />
      </main>
    </div>
  </template>

  <!-- Assignee edit push panel (opens over item detail) -->
  <template id="tpl-assignee-view">
    <div class="push-panel assignee-edit-panel" role="dialog" aria-modal="true">
      <header class="topbar push-topbar">
        <div class="topbar-inner">
          <button class="nav-btn tint cancel-btn" data-close data-t="cancel"></button>
          <div class="spacer"></div>
          <button class="save-btn-primary" data-confirm data-t="save"></button>
        </div>
      </header>
      <main class="scroll push-body">
        <div class="ae-topline">
          <div class="ae-topline-name">
            <label class="field-label" data-t="ae_name_ph"></label>
            <input class="row-input solo" id="ae-edit-name" type="text" autocapitalize="words" />
          </div>
          <div class="ae-topline-qty">
            <label class="field-label" data-t="ae_qty_label"></label>
            <input class="row-input solo" id="ae-edit-qty" type="number" min="1" inputmode="numeric" data-t-placeholder="ae_qty_ph" />
          </div>
        </div>
        <label class="field-label" data-t="ae_detail_label"></label>
        <textarea class="ae-note-area" id="ae-edit-note" rows="6" data-t-placeholder="ae_note_ph"></textarea>
      </main>
    </div>
  </template>

  <!-- Issue #59: single-item "Assign to…" sheet — pick a pill or type a name -->
  <template id="tpl-assignee-picker-sheet">
    <div class="sheet-backdrop"></div>
    <div class="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <button class="sheet-btn" data-close data-t="cancel"></button>
        <div class="sheet-title" data-t="ae_assign_other"></div>
        <button class="sheet-btn primary" data-confirm data-t="save"></button>
      </div>
      <div class="sheet-body">
        <div class="assign-pill-row" id="assignee-picker-pills"></div>
        <input class="row-input solo" id="assignee-picker-input" type="text" autocomplete="off" autocapitalize="words" data-t-placeholder="other_person_ph" />
      </div>
    </div>
  </template>

  <!-- Bulk actions sheet (selection overflow) -->
  <template id="tpl-bulk-actions-sheet">
    <div class="sheet-backdrop"></div>
    <div class="sheet confirm-sheet">
      <div class="sheet-body">
        <p class="confirm-title"></p>
      </div>
      <p class="assign-pill-label" id="bulk-people-label"></p>
      <div class="assign-pill-row assign-pill-row--sheet" id="bulk-people"></div>
      <div class="confirm-actions">
        <button class="row-button" id="bulk-move-end"></button>
        <button class="row-button destructive filled" id="bulk-delete"></button>
        <button class="row-button" data-close data-t="cancel"></button>
      </div>
    </div>
  </template>

  <!-- Bulk assign to "someone else" sheet -->
  <template id="tpl-bulk-other-sheet">
    <div class="sheet-backdrop"></div>
    <div class="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <button class="sheet-btn" data-close data-t="cancel"></button>
        <div class="sheet-title" data-t="other_person_title"></div>
        <button class="sheet-btn primary" data-confirm data-t="save"></button>
      </div>
      <div class="sheet-body">
        <input class="row-input solo" id="bulk-other-input" type="text" autocomplete="off" autocapitalize="words" data-t-placeholder="other_person_ph" />
      </div>
    </div>
  </template>

  <!-- Bulk delete confirmation -->
  <template id="tpl-confirm-bulk-delete-sheet">
    <div class="sheet-backdrop"></div>
    <div class="sheet confirm-sheet">
      <div class="sheet-body">
        <p class="confirm-title"></p>
        <p class="sheet-hint confirm-hint" data-t="confirm_delete_hint"></p>
      </div>
      <div class="confirm-actions">
        <button class="row-button destructive filled" data-confirm></button>
        <button class="row-button" data-close data-t="cancel"></button>
      </div>
    </div>
  </template>

  <!-- Sort options sheet -->
  <template id="tpl-sort-sheet">
    <div class="sheet-backdrop"></div>
    <div class="sheet confirm-sheet">
      <div class="sheet-body">
        <p class="confirm-title" data-t="sort_by"></p>
      </div>
      <div class="sort-options" id="sort-options">
        <button class="sort-option" data-sort="date_asc"><span data-t="sort_date_asc"></span></button>
        <button class="sort-option" data-sort="date_desc"><span data-t="sort_date_desc"></span></button>
        <button class="sort-option" data-sort="alpha_asc"><span data-t="sort_alpha_asc"></span></button>
        <button class="sort-option" data-sort="alpha_desc"><span data-t="sort_alpha_desc"></span></button>
      </div>
      <div class="confirm-actions">
        <button class="row-button" data-close data-t="cancel"></button>
      </div>
    </div>
  </template>

  <!-- Paste-detected sheet (shown when user pastes multi-line into add-item) -->
  <template id="tpl-paste-detect-sheet">
    <div class="sheet-backdrop"></div>
    <div class="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <button class="sheet-btn" data-close data-t="single_item"></button>
        <div class="sheet-title" data-t="detected_list_title"></div>
        <button class="sheet-btn primary" data-confirm data-t="add_all"></button>
      </div>
      <div class="sheet-body">
        <p class="sheet-hint" id="detect-hint"></p>
        <textarea class="sheet-textarea" id="detect-text"></textarea>
      </div>
    </div>
  </template>

  <div id="toast" class="toast" hidden></div>

  <script src="./app.js"></script>
</body>
</html>
